name: Publish site

# Publishes frontend/ to GitHub Pages as the site root, so the studio is at
# https://<user>.github.io/<repo>/ rather than one folder down.
#
# This needs Pages set to **Source: GitHub Actions** (Settings -> Pages).
# With "Deploy from a branch" Pages can only serve the repo root or /docs, and
# the root here is the README — which is why branch-deploy showed the README
# instead of the studio.
#
# An earlier version of this mirrored frontend/ into a separate public repo,
# because Pages cannot serve a private repo on the free plan. That is no longer
# needed now the repo is public: no second repo, no personal access token, no
# SITE_REPO variable.

on:
  push:
    branches: [main]
    paths:
      # Code only. Data changes no longer touch the repo at all — they land
      # in the Google Sheet, which the site reads at runtime — so a data
      # refresh does not (and must not) trigger a redeploy.
      - 'frontend/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Re-run ipopulse build before publishing'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue rather than cancel so a data push is not
# silently dropped by a later docs push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # The page fetches the sheet itself, so it needs the id — and the id is
      # not committed (see .gitignore). Generate the one-line config here from
      # the same secret the backend uses. Without it the site would deploy
      # and load nothing, which is worse than not deploying.
      - name: Write frontend config
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          # Optional. Set it (repo variable, not a secret — it ends up in the
          # published JS anyway) once the backend is hosted, and the site's
          # run button drives that API instead of GitHub Actions.
          IPOPULSE_TRIGGER_API: ${{ vars.IPOPULSE_TRIGGER_API }}
          # The site's front-door password. Only a PBKDF2 hash of it reaches
          # the published JS — the password itself never leaves this step.
          IPOPULSE_TRIGGER_PASSWORD: ${{ secrets.IPOPULSE_TRIGGER_PASSWORD }}
          # Optional. The fine-grained PAT that lets the studio's Run job panel
          # dispatch schedule.yml. AES-GCM sealed under the password above
          # before it reaches config.js — never written in the clear, which the
          # leak scan below independently enforces. Unset simply means the panel
          # asks for a token by hand instead. See cli.py, _sealed_pat.
          GH_DISPATCH_PAT: ${{ secrets.GH_DISPATCH_PAT }}
          # Where the pre-rendered narration lives, so the site can PLAY audio
          # with no backend — /api/voice cannot exist on Pages and the voice key
          # must never reach a browser. narrate.yml puts MP3s on a Release, the
          # mirror step below copies them into frontend/audio/, and the page
          # derives each filename from a hash of the script it is showing
          # (cli.py _audio_base, voice.py script_hash). The base must stay
          # SAME-ORIGIN or the fetch is CORS-blocked and every reel is silent —
          # _audio_base explains why in full. Left unset this is '', which is
          # not a failure: the buttons simply read "not narrated yet".
          # GITHUB_REPOSITORY is always set by Actions, so _audio_base knows it
          # is building the published site and no configuration is needed here.
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Point the site at a DIFFERENT host for the clips — set this repo
          # variable and nothing else changes. It must be a host that sends
          # Access-Control-Allow-Origin, because studio.js fetches the bytes.
          # Verified 30 Aug 2026: raw.githubusercontent.com, cdn.jsdelivr.net
          # and GitHub Pages all send `*`; GitHub RELEASE ASSETS SEND NONE,
          # which is what made the studio silent in the first place. Unset
          # means the Release-mirror path below, which is same-origin.
          IPOPULSE_AUDIO_BASE: ${{ vars.IPOPULSE_AUDIO_BASE }}
        run: |
          if [ -z "$GOOGLE_SHEETS_ID" ]; then
            echo "::error::GOOGLE_SHEETS_ID is not set - the site would load with no data."
            exit 1
          fi
          # Fail here rather than shipping an open studio. gate.js also
          # refuses to open without a hash, so a miss would deploy a site
          # nobody can use - better to stop while someone is watching.
          if [ -z "$IPOPULSE_TRIGGER_PASSWORD" ]; then
            echo "::error::IPOPULSE_TRIGGER_PASSWORD is not set - the site would deploy with no access gate. Add it under Settings > Secrets > Actions."
            exit 1
          fi
          cd backend && python -m ipopulse.cli config

      # Check every record still renders before publishing, so a broken row is
      # caught here rather than as a blank card on the live site. This reads
      # the sheet, so unlike the old local build it needs credentials.
      #
      # The condition is not `inputs.rebuild != false`: on a push event
      # `inputs.rebuild` is null, and GitHub coerces null and false both to 0
      # when comparing across types, so `null != false` is FALSE and the check
      # silently skipped on every push — exactly the case it exists for.
      - name: Check the sheet renders
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          # Passed straight through: the code takes the JSON itself or a path
          # to it. Writing it to a file first is what turned a mis-set secret
          # into an unreadable JSONDecodeError instead of a clear message.
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
        run: |
          if [ -z "$GOOGLE_SHEETS_KEY" ]; then
            echo "::notice::No service-account secret - skipping the render check."
            exit 0
          fi
          cd backend && python -m ipopulse.cli build

      # THE GATE. The repo is public and so is the site; this is the last thing
      # standing between a key and the open internet, so it runs before the
      # deploy, never after. Verified to block AIza... and AQ.... keys while
      # passing ordinary code.
      # No data file ships any more — the site fetches the sheet at runtime,
      # so there is nothing binary to flatten and scan. What DOES ship is
      # config.js with the sheet id, which is public by necessity: the
      # browser cannot fetch the sheet without it.
      - name: Fail if a secret leaked into the frontend
        run: |
          SECRETS='AIza[0-9A-Za-z_-]{20,}|AQ\.[A-Za-z0-9_-]{20,}|BEGIN [A-Z ]*PRIVATE KEY|(GEMINI_API_KEY|IPOPULSE_TRIGGER_PASSWORD|GOOGLE_SHEETS_KEY|GH_DISPATCH_PAT)[[:space:]]*[:=][[:space:]]*[^[:space:]]+|iam\.gserviceaccount\.com|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}'
          if grep -rIn --include=*.js --include=*.html --include=*.json --include=*.css --include=*.md -E "$SECRETS" frontend/; then
            echo "::error::Possible secret in frontend/ - refusing to publish."
            exit 1
          fi
          # A service-account key reaching the site would be the worst case,
          # so its marker fields are checked by name too, not just the blob.
          SA='"private_key"|"client_email"|service_account'
          if grep -rIn --include=*.js --include=*.json -E "$SA" frontend/; then
            echo "::error::Service-account material in frontend/ - refusing to publish."
            exit 1
          fi
          echo "frontend/ is clean."

      # THE NARRATION, mirrored onto our own origin.
      #
      # narrate.yml leaves the MP3s on the "audio" Release so they never enter
      # git. They cannot be played from there: studio.js FETCHES the bytes (it
      # cuts the reel to the decoded duration and feeds capture.js a same-origin
      # blob), and Release assets carry no Access-Control-Allow-Origin — checked
      # 30 Aug 2026 on both the 302 and the redirect target. A cross-origin fetch
      # against them is blocked, which is silence on every reel in every
      # language. See cli.py _audio_base for the whole reasoning.
      #
      # So the clips ride along in the Pages artifact and the site reads
      # audio/<slug>-r<n>-<lang>-<hash>.mp3 from itself. Repo stays clean, no
      # CORS in the picture.
      #
      # No Release yet is the ordinary first-run case, not a failure: the site
      # publishes without audio and the buttons read "not narrated yet".
      - name: Mirror the narration into the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An explicit base means the clips are served from somewhere else
          # entirely, so there is nothing to mirror and megabytes of MP3 in the
          # Pages artifact would be dead weight.
          if [ -n "${{ vars.IPOPULSE_AUDIO_BASE }}" ]; then
            echo "::notice::IPOPULSE_AUDIO_BASE is set - the site reads clips from there, skipping the mirror."
            exit 0
          fi
          mkdir -p frontend/audio
          if ! gh release view audio >/dev/null 2>&1; then
            echo "::notice::No 'audio' Release yet - publishing without narration. Run the 'Narrate reels' workflow to create it."
            exit 0
          fi
          gh release download audio --dir frontend/audio --pattern '*.mp3' --clobber
          COUNT=$(ls -1 frontend/audio/*.mp3 2>/dev/null | wc -l)
          echo "Mirrored $COUNT clip(s) into the site."
          echo "### Narration shipped: $COUNT clip(s)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      # path: frontend makes the studio the site root, not /frontend/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v4
