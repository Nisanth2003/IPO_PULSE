name: Scheduled data refresh

# The GitHub-hosted half of deploy/. systemd and Task Scheduler need a machine
# that is switched on; this needs nothing but the repo.
#
# NOTE ON PAGES: GitHub Pages is static hosting — it runs no processes, so a
# timer cannot live "on Pages". This workflow is the GitHub-native equivalent:
# Actions runs the job and it writes straight into the Google Sheet. Nothing
# is committed and nothing redeploys, because the site reads that sheet at
# runtime — the data is live the moment the run finishes.
#
# Cron is UTC and has no timezone option, so every time below is IST minus
# 5:30, with the IST time in the comment. Actions cron is also best-effort:
# under load a run can start 5-20 minutes late, so nothing here is timed to
# land on a deadline — 10:00 is after bidding opens rather than at it, and
# 18:35 is clear of the 17:00 cut-off with room to drift.
#
# GMP is read FOUR times a day, and the times are measured rather than picked.
# InvestorGain opens a row for the day at 05:55 and then revises it in place, in
# batch passes: ~10:55, mid-afternoon, ~21:00 (all 14 IPOs inside nine minutes),
# and a final settle at 23:28-23:37. Across 17 Aug 2026 a single issue went
# 30 -> 33 -> 34 -> 29; Tempsens went 110 -> 152. So one read a day is not a
# schedule, it is a snapshot, and whichever hour you pick is wrong by the
# afternoon.
#
#   11:15 / 14:15 / 21:15   `gmp-sync` only — free, keyless, no model. Each one
#                           carries --reconcile, so a revised figure overwrites
#                           the stored one rather than being reported as a clash.
#   23:45                   the full `grey` chain, after the settle, so the day
#                           closes on the figure InvestorGain finished with.
#
# The intraday slots sit ~15 minutes after each observed batch, so they read the
# new figure rather than racing it. Drift only helps: Actions cron runs late, and
# late is further past a revision, never before it.

on:
  schedule:
    - cron: '30 4 * * *'      # 10:00 IST daily   — bidding opens; the day's first read
    - cron: '45 5 * * *'      # 11:15 IST daily   — GMP only, after the ~10:55 revision
    - cron: '45 8 * * *'      # 14:15 IST daily   — GMP only, afternoon revision
    - cron: '5 13 * * *'      # 18:35 IST daily   — after close; the settled figures
    - cron: '45 15 * * *'     # 21:15 IST daily   — GMP only, after the ~21:00 revision
    - cron: '15 18 * * *'     # 23:45 IST daily   — GMP once InvestorGain has settled the day
    - cron: '30 21 * * 6'     # 03:00 IST Sunday  — translate
    - cron: '30 22 * * 6'     # 04:00 IST Sunday  — Excel report
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Jobs to run, in order (space separated). e.g. "sync enrich build"'
        required: false
        default: 'daily'

permissions:
  contents: read              # nothing is committed any more — see the end

# Never let the 23:45 GMP run overlap a slow 18:35 one. This matters more than
# it looks: a whole-tab rewrite has no lock behind it, so two concurrent runs
# are last-write-wins over the entire sheet. It is not hypothetical — on
# 17 Aug 2026 the Windows `daily` and `grey` tasks fired in the same second as
# sleep-missed catch-ups and `daily` died with 0x8007042B, having written
# nothing. This group only guards Actions against itself; it cannot see runs
# on another machine.
concurrency:
  group: ipopulse-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # Secrets never touch the repo. The service-account key is one secret
      # holding the whole JSON; write it out, point the CLI at it, delete it.
      # Passed through env rather than interpolated into the script: the JSON
      # contains quotes and braces, and `${{ }}` inside a shell string would
      # end the quoting at the first one.
      #
      # This key used to be optional: the store was a local file and only the
      # `push` step needed Google. That is inverted now — the sheet IS the
      # store, so without the key nothing can be read or written and there is
      # no useful subset of the run left to attempt. Fail here, once and
      # clearly, instead of letting every job fail in turn below.
      - name: Check the service-account secret
        shell: bash
        env:
          SA: ${{ secrets.GOOGLE_SHEETS_KEY }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::GOOGLE_SHEETS_KEY is not set. The store is a Google Sheet, so every job needs it."
            exit 1
          fi
          case "$SA" in
            '{'*) echo "Secret looks like service-account JSON." ;;
            *) echo "::error::GOOGLE_SHEETS_KEY is not JSON. It must be the CONTENTS of the key file (starting with '{'), not a path - a path from your machine does not exist on the runner."
               exit 1 ;;
          esac

      # Which job? A dispatch says so explicitly; a cron is identified by the
      # schedule string that fired it.
      - id: pick
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            # The 23:45 slot is `grey` alone, and `grey` now ends in `build`
            # (control.CHAINS) so the night's GMP is still verified. It is NOT
            # `grey daily`: `sync` fifteen minutes before midnight files a
            # bidding day under tomorrow the moment the run drifts, and Actions
            # cron drifts late by design. `daily` already ran at 18:35.
            '15 18 * * *')  JOBS='grey' ;;
            # Intraday price-only refreshes. `gmp-sync` alone: it is free,
            # keyless and deterministic, so it can run as often as the desk moves
            # without touching Gemini quota or spending an enrich budget. Its
            # argv carries --reconcile, which is the whole point — a revised
            # figure OVERWRITES the one on file instead of being filed as a clash
            # and left. Deliberately not `grey`, which would drag the model step
            # and `build` along four extra times a day for nothing.
            '45 5 * * *'|'45 8 * * *'|'45 15 * * *')  JOBS='gmp-sync' ;;
            '30 21 * * 6')  JOBS=translate ;;
            '30 22 * * 6')  JOBS=report ;;
            '')             JOBS='${{ inputs.jobs }}' ;;   # manual dispatch
            *)              JOBS=daily ;;                  # 10:00 and 18:35
          esac
          JOBS="${JOBS:-daily}"

          # The push-stripping fallback that used to live here is gone along
          # with the push jobs: they existed to copy a local store up into the
          # sheet, and the sheet is the store now. Missing credentials are
          # caught earlier, where nothing can run at all.
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"
          echo "Running: $JOBS"

      - name: Run
        working-directory: backend
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:     ${{ vars.GEMINI_MODEL }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          # The JSON itself; sheets.py accepts contents or a path.
          GOOGLE_SHEETS_KEY: ${{ secrets.GOOGLE_SHEETS_KEY }}
          GOOGLE_SHEETS_TAB: ${{ vars.GOOGLE_SHEETS_TAB }}
          PYTHONIOENCODING: utf-8
        run: python -m ipopulse.cli job ${{ steps.pick.outputs.jobs }}

      # Keep the rollback snapshot after the runner is gone.
      #
      # `gmp-sync --reconcile --write` calls store.backup() before its first
      # write, which drops backend/out/ipo-pulse.prev.xlsx — the whole sheet as it
      # was one moment earlier. On your laptop that file sits there as an undo. On
      # a runner it was written and then deleted with the machine, so the one path
      # that does MOST of the writing had no undo at all.
      #
      # That matters specifically because write_records clears every tab before
      # rewriting them: a run interrupted in that window leaves the store empty,
      # and this artifact is then the only copy of what was in it.
      #
      # `if: always()` is the point of the step — a FAILED run is exactly when the
      # snapshot is worth having, and the default would skip it.
      #
      # The weekly `report` job writes its .xlsx to the same folder and was being
      # discarded the same way, so that comes along too. 30 days is longer than
      # any IPO's three-week life, which is as far back as a rollback is useful.
      - name: Keep the snapshot and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipopulse-out-${{ github.run_id }}
          path: |
            backend/out/*.xlsx
          retention-days: 30
          if-no-files-found: ignore

      # No commit step any more, and that is the point.
      #
      # The jobs write straight into the Google Sheet, which the site reads at
      # runtime — so a run is live the moment it finishes. There is no data
      # file in the repo to add, no binary to conflict on a rebase, and no
      # Pages rebuild standing between a fetched number and a viewer seeing
      # it. The whole commit-pull-rebase-push dance this replaced existed only
      # to move a file that no longer exists.
      #
      # Partial runs are still safe for the same reason they were before: each
      # job writes as it goes, so a later failure leaves the earlier jobs
      # already saved.
      - name: Confirm the sheet is readable
        if: always()
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          URL="https://docs.google.com/spreadsheets/d/$GOOGLE_SHEETS_ID/gviz/tq?tqx=out:csv&sheet=IPOs"
          if curl -sfL -o /dev/null "$URL"; then
            echo "The sheet is readable without credentials - the site can load it."
          else
            echo "::error::The sheet is NOT readable anonymously, so the published site cannot load it. Set sharing to: Anyone with the link can view."
            exit 1
          fi
