[project]
name = "ipopulse"
version = "1.0.0"
description = "Data layer for the IPO Pulse reel studio — numbers, prose, Excel reports and static JSON."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0.0"]
sheets = ["google-api-python-client>=2.100", "google-auth>=2.23"]

[project.scripts]
ipopulse = "ipopulse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ipopulse", "ipopulse.providers"]
